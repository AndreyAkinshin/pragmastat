# Pragmastat Build Configuration
# Task runner: mise (https://mise.jdx.dev/)
#
# Usage: mise run <task>
# List all tasks: mise tasks

# Toolchain versions marked "sync:" are duplicated by setup-* steps in
# .github/workflows/*.yml so CI reuses GitHub's prewarmed tool cache. Keep
# both sides in step when bumping.
[tools]
dotnet = "10.0"        # sync: actions/setup-dotnet in the workflows
go = "1.26"            # sync: the go directive in go/go.mod
golangci-lint = "2.12.2"
java = "temurin-21"    # sync: actions/setup-java (Gradle 9 daemon JDK; jvmToolchain still targets 11)
node = "22"            # sync: actions/setup-node in ci.yml (publish-npm pins 24 for npm OIDC)
# npm backend: aqua's release-asset matching is unreliable for pnpm 11.x
"npm:pnpm" = "11"
python = "3.12"        # sync: actions/setup-python in the workflows
# Pinned, not "latest": ruff's lint set is select=ALL, so a new ruff release can
# enable a new rule and turn CI red with zero code changes. Bump deliberately.
ruff = "0.16.0"
rust = "1.97.1"      # sync: dtolnay/rust-toolchain in ci.yml
# Pinned in lockstep with tools/Cargo.toml's typst-syntax: the PDF is rendered by
# this binary while the MDX generator parses the same sources with that crate.
# A drifting "latest" would silently outpace the parser. Bump both together.
typst = "0.15.1"

# ==========================================================================
# C# Tasks (cs/)
# ==========================================================================

[tasks."cs:build"]
description = "Build C# package (debug mode)"
dir = "cs"
run = "dotnet build -c Debug"

[tasks."cs:build:release"]
description = "Build C# package (release mode)"
dir = "cs"
run = "dotnet build -c Release"

[tasks."cs:test"]
description = "Run C# tests"
dir = "cs/Pragmastat.Tests"
run = "dotnet run"

[tasks."cs:check"]
description = "Verify C# code formatting"
dir = "cs"
run = "dotnet format --verify-no-changes"

[tasks."cs:check:fix"]
description = "Format C# code"
dir = "cs"
run = "dotnet format"

[tasks."cs:clean"]
description = "Clean C# build artifacts"
dir = "cs"
run = "rm -rf bin/ obj/ *.nupkg"

[tasks."cs:restore"]
description = "Restore C# dependencies"
dir = "cs"
run = "dotnet restore"

[tasks."cs:demo"]
description = "Run C# demo"
dir = "cs/Pragmastat.Demo"
run = "dotnet run"

[tasks."cs:pack"]
description = "Pack C# NuGet package"
dir = "cs"
depends = ["img:logo"]
run = """
mkdir -p ./artifacts
dotnet pack ./Pragmastat/Pragmastat.csproj --configuration Release --include-symbols --include-source -p:SymbolPackageFormat=snupkg --output ./artifacts
"""

[tasks."cs:gen"]
description = "Generate C# reference test files"
dir = "cs"
run = "dotnet run --project Pragmastat.TestGenerator/Pragmastat.TestGenerator.csproj"

[tasks."cs:ci"]
description = "Run C# CI pipeline"
run = [
    { task = "cs:clean" },
    { task = "cs:restore" },
    { task = "cs:check" },
    { task = "cs:build" },
    { task = "cs:test" },
]

# ==========================================================================
# Go Tasks (go/)
# ==========================================================================

[tasks."go:build"]
description = "Build Go package"
dir = "go"
run = "go build ./..."

[tasks."go:test"]
description = "Run Go tests"
dir = "go"
# -count=1 disables the test cache. Go keys that cache on the test binary and the files it
# opens through the toolchain, not on files a test reads at runtime, so an edit anywhere under
# tests/ leaves a passing result cached and `go test` reports ok without running anything.
# Verified by perturbing a fixture by one ulp: the suite still said "(cached)".
#
# This is the same shape as the warm build cache that hid the FMA contraction: a green result
# that was never computed. A test run that can be skipped is not a check.
run = "go test -count=1 -race ./..."

[tasks."go:test:verbose"]
description = "Run Go tests with verbose output"
dir = "go"
run = "go test -race -v ./..."

[tasks."go:check"]
description = "Check Go code (format, lint, no FMA contraction)"
dir = "go"
run = """
test -z "$(go fmt ./...)" || { echo "Code is not formatted"; exit 1; }
golangci-lint run
# The conformance probe sits behind a build tag, so the default run does not see it. A file
# nobody lints is a file that rots, and this one exists to be trusted.
golangci-lint run --build-tags conformance
mise run go:check:fma
"""

[tasks."go:check:fma"]
description = "Assert no kernel is FMA-contracted except the documented exemptions"
dir = "go"
# The Go specification lets the compiler fuse a multiply and an add into a single rounding, and gc
# does it on every FMA-capable target and never on amd64, where all of CI runs. A fused result
# differs in the last bit from the other six languages, none of which fuse. That breaks the
# randomization contract, under which a seeded stream must be identical in every language. Those
# kernels pin the intermediate rounding with explicit float64() conversions; this guards the
# conversions against being "simplified" away again.
#
# There is no exemption list, and that is the point: every kernel is guarded, so a new file is
# covered the moment it is written and nobody has to remember to enrol it. Pinning costs nothing
# on amd64, where the compiler would not have fused anyway, so there was never a reason to
# exempt anything.
#
# What this cannot fix is math.Exp / math.Log / math.Pow / math.Erfc. They are polynomial
# evaluations inside the standard library, they fuse on these targets too, and their fused
# instructions are attributed to GOROOT rather than to this module. Anything computed through
# them conforms at a stated tolerance and not bitwise, in any language.
#
# A private GOCACHE forces a cold compile. Reusing the shared cache silently replays an earlier
# build and prints no assembly at all, which is exactly how this defect stayed hidden.
run = """
#!/usr/bin/env bash
set -euo pipefail
cache="$(mktemp -d)"
trap 'rm -rf "$cache"' EXIT
for arch in arm64 ppc64le s390x riscv64; do
  fused="$(GOCACHE="$cache/$arch" GOARCH="$arch" go build -gcflags=-S ./... 2>&1 \\
    | grep -E 'FMADD|FMSUB|FNMADD|FNMSUB' || true)"
  if [ -n "$fused" ]; then
    echo "ERROR: FMA contraction on $arch:" >&2
    echo "$fused" >&2
    echo "Pin the rounding with an explicit float64() conversion around the product." >&2
    exit 1
  fi
done
echo "no FMA contraction anywhere (arm64, ppc64le, s390x, riscv64)"
"""

[tasks."go:check:fix"]
description = "Format Go code"
dir = "go"
run = "go fmt ./..."

[tasks."go:clean"]
description = "Clean Go build cache"
dir = "go"
run = """
go clean
rm -f coverage.out coverage.html
"""

[tasks."go:restore"]
description = "Download and verify Go dependencies"
dir = "go"
run = """
go mod download
go mod verify
"""

[tasks."go:demo"]
description = "Run Go demo"
dir = "go"
run = "go run ./demo"

[tasks."go:bench"]
description = "Run Go benchmarks"
dir = "go"
run = "go test -bench=. ./..."

[tasks."go:coverage"]
description = "Run Go tests with coverage"
dir = "go"
run = "go test -cover ./..."

[tasks."go:ci"]
description = "Run Go CI pipeline"
run = [
    { task = "go:clean" },
    { task = "go:restore" },
    { task = "go:check" },
    { task = "go:build" },
    { task = "go:test" },
]

