description = "Check documentation tools (clippy, fmt, cargo check)"
dir = "tools"
run = """
cargo clippy --all-targets -- -D warnings
cargo fmt -- --check
"""

[tasks."tools:check:fix"]
description = "Format documentation tools"
dir = "tools"
run = "cargo fmt"

[tasks."tools:test"]
description = "Run documentation tools tests"
dir = "tools"
run = "cargo test"

# ==========================================================================
# Documentation Generation Tasks
# ==========================================================================

[tasks."docs:version"]
description = "Sync versioned manifests"
run = "cargo run --manifest-path tools/Cargo.toml --release -- sync version"

[tasks."docs:templates"]
description = "Sync templated docs and READMEs"
run = "cargo run --manifest-path tools/Cargo.toml --release -- sync templates"

[tasks."docs:sync"]
description = "Sync versions and templated docs"
run = "cargo run --manifest-path tools/Cargo.toml --release -- sync all"

[tasks."docs:sync:bounds-width"]
description = "Generate static width-convergence tables from sim/bounds-width.json"
run = "cargo run --manifest-path tools/Cargo.toml --release -- sync bounds-width"

[tasks."pdf:restore"]
description = "Download required fonts for PDF generation"
run = """
if [ ! -d "manual/fonts/Ubuntu" ] || [ ! -d "manual/fonts/Vollkorn" ]; then
  mkdir -p manual/fonts/Ubuntu manual/fonts/Vollkorn
  FONTS_BASE="https://raw.githubusercontent.com/google/fonts/main"
  echo "Downloading Ubuntu font..."
  curl -sL -o manual/fonts/Ubuntu/Ubuntu-Regular.ttf "${FONTS_BASE}/ufl/ubuntu/Ubuntu-Regular.ttf"
  curl -sL -o manual/fonts/Ubuntu/Ubuntu-Bold.ttf "${FONTS_BASE}/ufl/ubuntu/Ubuntu-Bold.ttf"
  curl -sL -o manual/fonts/Ubuntu/Ubuntu-Light.ttf "${FONTS_BASE}/ufl/ubuntu/Ubuntu-Light.ttf"
  curl -sL -o manual/fonts/Ubuntu/Ubuntu-Italic.ttf "${FONTS_BASE}/ufl/ubuntu/Ubuntu-Italic.ttf"
  echo "Downloading Vollkorn font..."
  VOLLKORN_BASE="https://cdn.jsdelivr.net/fontsource/fonts/vollkorn@latest/latin"
  curl -sL -o manual/fonts/Vollkorn/Vollkorn-Regular.ttf "${VOLLKORN_BASE}-400-normal.ttf"
  curl -sL -o manual/fonts/Vollkorn/Vollkorn-Bold.ttf "${VOLLKORN_BASE}-700-normal.ttf"
  curl -sL -o manual/fonts/Vollkorn/Vollkorn-Italic.ttf "${VOLLKORN_BASE}-400-italic.ttf"
  curl -sL -o manual/fonts/Vollkorn/Vollkorn-BoldItalic.ttf "${VOLLKORN_BASE}-700-italic.ttf"
  echo "Fonts installed."
else
  echo "Fonts already installed."
fi
"""

[tasks."pdf:build"]
description = "Build PDF manual"
depends = ["pdf:restore", "docs:sync", "img:build"]
run = "typst compile --root . --font-path manual/fonts manual/template.typ manual/pragmastat.pdf"

[tasks."pdf:build:release"]
description = "Build PDF manual (release mode)"
depends = ["pdf:restore", "docs:sync", "img:build"]
run = "typst compile --root . --font-path manual/fonts manual/template.typ manual/pragmastat.pdf"

[tasks."web:gen"]
description = "Generate Astro content"
depends = ["docs:sync"]
run = "cargo run --manifest-path tools/Cargo.toml --release -- build web"

[tasks."web:restore"]
description = "Install web dependencies"
dir = "web"
run = "pnpm install"

[tasks."web:dev"]
description = "Start Astro dev server"
depends = ["web:restore", "web:gen"]
dir = "web"
run = "pnpm dev"

[tasks."web:serve"]
description = "Alias for web:dev"
depends = ["web:restore", "web:gen"]
dir = "web"
run = "pnpm dev"

[tasks."web:build"]
description = "Build Astro site"
depends = ["web:restore", "web:gen"]
dir = "web"
run = """
cp ../manual/pragmastat.pdf public/
cp ../img/logo.svg public/img/
pnpm build
"""

[tasks."web:build:release"]
description = "Build Astro site (release mode)"
depends = ["web:restore", "web:gen"]
dir = "web"
run = """
cp ../manual/pragmastat.pdf public/
cp ../img/logo.svg public/img/
NODE_ENV=production pnpm build
"""

[tasks."web:clean"]
description = "Clean Astro build artifacts"
dir = "web"
run = """
rm -rf dist .astro .output
"""

[tasks."docs:clean"]
description = "Clean generated documentation artifacts"
# Restores whatever the clean removed that git tracks, for the same reason as img:clean: the
# bounds-width tables are generated and committed, docs:sync puts them back inside the
# pipeline, but a standalone `mise run clean` would otherwise leave them missing.
run = """
cargo run --manifest-path tools/Cargo.toml --release -- clean
missing="$(git ls-files --deleted)"
[ -z "$missing" ] || git checkout -- $missing
"""

[tasks."docs:ci"]
description = "Run documentation CI pipeline"
run = [
    { task = "tools:check" },
    { task = "tools:test" },
    { task = "docs:clean" },
    { task = "docs:sync" },
    # img:logo regenerates the committed img/logo.png, so the drift check below
    # also catches it going stale against logo.svg — it silently did for months.
    { task = "img:logo" },
    # Fail CI if regeneration left uncommitted drift in tracked generated docs
    # (per-language READMEs, width tables, logo.png). Guards against shipping
    # stale output.
    "git diff --exit-code || { echo 'ERROR: docs:sync produced uncommitted drift — regenerate and commit generated docs' >&2; exit 1; }",
    # Fail CI if any tracked file is missing from the working tree. The clean tasks delete
    # committed generated artifacts (img/logo.png, the bounds-width tables) on the reasoning
    # that build puts them back, which is true and which makes `clean` followed by a blanket
    # `git add -A` a way to commit their deletion without noticing. It has happened once.
    # `git ls-files --deleted` is the invariant that catches it, and it costs nothing.
    # Every fixture count stated in the manual must match the directory it describes. They are
    # prose, they ship in the PDF and on the website, and four of them went stale the moment
    # fixtures were added at the decision boundaries.
    "python3 tests/check_manual_counts.py .",
    "test -z \"$(git ls-files --deleted)\" || { echo 'ERROR: tracked files are missing from the working tree:' >&2; git ls-files --deleted >&2; echo 'A clean task removed a committed artifact and the build did not put it back.' >&2; exit 1; }",
    { task = "pdf:build" },
    { task = "web:build" },
]

[tasks."docs:ci:release"]
description = "Run documentation CI pipeline (release mode)"
run = [
    { task = "tools:check" },
    { task = "tools:test" },
    { task = "docs:clean" },
    { task = "docs:sync" },
    { task = "img:logo" },
    "git diff --exit-code || { echo 'ERROR: docs:sync produced uncommitted drift — regenerate and commit generated docs' >&2; exit 1; }",
    { task = "pdf:build:release" },
    { task = "web:build:release" },
]

# ==========================================================================
# Aggregate Tasks
# ==========================================================================

[tasks."build"]
description = "Build all language implementations"
depends = ["cs:build", "go:build", "kt:build", "py:build", "r:build", "rs:build", "ts:build"]

[tasks."test"]
description = "Test all language implementations"
depends = ["cs:test", "go:test", "kt:test", "py:test", "r:test", "rs:test", "ts:test"]

[tasks."check"]
description = "Check all language implementations"
depends = ["cs:check", "go:check", "kt:check", "py:check", "r:check", "rs:check", "ts:check"]

[tasks."check:fix"]
description = "Auto-fix all language implementations"
depends = ["cs:check:fix", "go:check:fix", "kt:check:fix", "py:check:fix", "r:check:fix", "rs:check:fix", "ts:check:fix"]

[tasks."clean"]
description = "Clean all build artifacts"
depends = ["cs:clean", "go:clean", "kt:clean", "py:clean", "r:clean", "rs:clean", "ts:clean", "img:clean", "web:clean", "docs:clean"]

[tasks."demo"]
description = "Run demos for all language implementations"
depends = ["cs:demo", "go:demo", "kt:demo", "py:demo", "r:demo", "rs:demo", "ts:demo"]

[tasks."ci"]
description = "Run CI pipeline for all language implementations"
depends = ["cs:ci", "go:ci", "kt:ci", "py:ci", "r:ci", "rs:ci", "ts:ci", "docs:ci", "tests:check:rng-fixtures", "tests:check:conformance"]

# ==========================================================================
# Version Task
# ==========================================================================

[tasks."version"]
description = "Set version, sync, stage, and commit"
usage = 'arg "<version>" help="Version (e.g., 6.0.2 or v6.0.2)"'
run = '''
VERSION="${usage_version#v}"
if ! echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
  echo "Error: version must contain only digits and dots (got: $VERSION)" >&2
  exit 1
fi
echo "$VERSION" > VERSION
mise run docs:sync
git add -A
git diff --cached --quiet && echo "Already at $VERSION" || git commit -m "chore: bump version to $VERSION"
'''

# ==========================================================================
# Publish Task
# ==========================================================================

[tasks."publish"]
description = "Bump version, push, and trigger release"
usage = 'arg "<version>" help="Version (e.g., 6.0.2 or v6.0.2)"'
run = [
    "mise run version $usage_version",
    "git push",
    "gh workflow run publish.yml",
]

# ==========================================================================
# Docker Tasks
# ==========================================================================

[tasks."docker:build"]
description = "Build all Docker images"
run = "docker compose build"

[tasks."docker:clean"]
description = "Remove all Docker containers and images"
run = "docker compose down --rmi all --volumes --remove-orphans"
