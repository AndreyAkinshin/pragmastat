    { task = "rs:clean" },
    { task = "rs:restore" },
    { task = "rs:check" },
    { task = "rs:sim:check" },
    { task = "rs:build" },
    { task = "rs:test" },
]

[tasks."rs:sim"]
description = "Run Rust simulations"
dir = "rs/pragmastat-sim"
run = "cargo run --release --"

[tasks."rs:sim:all"]
description = "Run all Rust simulations (-p N to set parallelism, default 8)"
dir = "rs/pragmastat-sim"
run = """
#!/usr/bin/env bash
P=8
while getopts "p:" opt; do
  case $opt in
    p) P=$OPTARG ;;
  esac
done
cargo run --release -- avg-drift -e Mean,Median,Center -p "$P"
cargo run --release -- disp-drift -e StdDev,MAD,Spread -p "$P"
cargo run --release -- center-bounds -p "$P"
cargo run --release -- shift-bounds -p "$P"
cargo run --release -- ratio-bounds -p "$P"
cargo run --release -- bounds-width --publish
"""

[tasks."rs:sim:bounds-width"]
description = "Compute bounds width convergence for linspace(1,2,N)"
dir = "rs/pragmastat-sim"
