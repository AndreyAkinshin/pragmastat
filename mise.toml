rm -rf pragmastat.Rcheck pragmastat_*.tar.gz pragmastat/..Rcheck ..Rcheck
rm -rf pragmastat/src/*.o pragmastat/src/*.so pragmastat/src/*.dll pragmastat/src/*.dylib pragmastat/src/*.a pragmastat/src/symbols.rds
rm -rf pragmastat/inst/testdata pragmastat/tests/tests
rm -f pragmastat/src/Makevars  # emitted by ./configure
"""

[tasks."r:restore"]
description = "Install R package locally"
dir = "r/pragmastat"
run = """
Rscript -e "
  lib <- Sys.getenv('R_LIBS_USER')
  if (!dir.exists(lib)) dir.create(lib, recursive = TRUE)
  .libPaths(c(lib, .libPaths()))
  if (!requireNamespace('devtools', quietly = TRUE))
    install.packages('devtools', lib = lib, repos = 'https://cloud.r-project.org')
  devtools::install(upgrade = 'never')
"
"""

[tasks."r:demo"]
description = "Run R demo"
dir = "r/pragmastat"
run = """
Rscript -e "if (!requireNamespace('devtools', quietly = TRUE)) install.packages('devtools', repos = 'https://cloud.r-project.org'); devtools::install(quiet = TRUE, upgrade = 'never')"
Rscript inst/examples/demo.R
"""

[tasks."r:doc"]
description = "Build R documentation"
dir = "r/pragmastat"
run = "Rscript -e \"if (!requireNamespace('devtools', quietly = TRUE)) install.packages('devtools', repos = 'https://cloud.r-project.org'); devtools::document()\""

[tasks."r:ci"]
description = "Run R CI pipeline"
run = [
    { task = "r:clean" },
    { task = "r:restore" },
    { task = "r:check" },
    { task = "r:build" },
    { task = "r:test" },
]

# ==========================================================================
# Rust Tasks (rs/)
# ==========================================================================

[tasks."rs:build"]
description = "Build Rust package (debug mode)"
dir = "rs/pragmastat"
run = "cargo build"

[tasks."rs:build:release"]
description = "Build Rust package (release mode)"
dir = "rs/pragmastat"
run = "cargo build --release"

[tasks."rs:test"]
description = "Run Rust tests"
dir = "rs/pragmastat"
run = "cargo test --verbose"

[tasks."rs:check"]
description = "Check Rust code (clippy, fmt, cargo check, no fused multiply-add)"
dir = "rs/pragmastat"
run = """
cargo clippy -- -D warnings
cargo fmt -- --check
RUSTFLAGS="-D warnings" cargo check --all-targets
mise run rs:check:fma
"""

[tasks."rs:check:fma"]
description = "Assert no source file calls mul_add"
dir = "rs/pragmastat"
# rustc never contracts on its own, so Rust can only acquire a fused multiply-add by asking for
# one. `a.mul_add(b, c)` lowers to llvm.fma.f64 and rounds once where `a * b + c` rounds twice,
# on every target, hardware FMA or softfloat. That is a different algorithm, not a faster
# spelling of the same one, and none of the other six implementations has one anywhere.
#
# This is not a precaution. clippy's `suboptimal_flops` proposed exactly this rewrite once, it
# was accepted, and Rust drew different random numbers from the same seed as the other six for
# months while a 1e-12 comparison called it a pass. The lint is now allowed away in lib.rs; this
# catches a hand-written one, which no lint setting can prevent.
run = """
#!/usr/bin/env bash
set -euo pipefail
hits="$(grep -rn 'mul_add' src/ examples/ tests/ 2>/dev/null | grep -v '^[^:]*:[0-9]*: *//' || true)"
if [ -n "$hits" ]; then
  echo "ERROR: mul_add in Rust source — it rounds once where the specification rounds twice:" >&2
  echo "$hits" >&2
  echo "Write 'a * b + c'. If a fused rounding is genuinely intended, say so where it is used." >&2
  exit 1
fi
echo "no fused multiply-add in Rust source"
"""

[tasks."rs:check:fix"]
description = "Format Rust code"
dir = "rs/pragmastat"
run = "cargo fmt"

[tasks."rs:restore"]
description = "Download Rust dependencies"
dir = "rs/pragmastat"
run = "cargo fetch"

[tasks."rs:clean"]
description = "Clean Rust build artifacts"
dir = "rs/pragmastat"
