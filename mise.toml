# ==========================================================================
# Image Generation Tasks (img/)
# ==========================================================================

[tasks."img:build"]
description = "Generate images"
dir = "img"
run = """
if [ ! -f "/.dockerenv" ] && [ -z "$VIRTUAL_ENV" ]; then
    # Reinstall whenever requirements.txt changes: a venv created once would
    # otherwise keep rendering figures with whatever was current back then,
    # regardless of what requirements.txt now declares.
    STAMP="venv/.requirements.sha256"
    WANT="$(sha256sum requirements.txt | cut -d' ' -f1)"
    if [ ! -d "venv" ]; then
        python3 -m venv venv
        ./venv/bin/pip install -q --upgrade pip
    fi
    if [ "$(cat "$STAMP" 2>/dev/null)" != "$WANT" ]; then
        ./venv/bin/pip install -q -r requirements.txt
        echo "$WANT" > "$STAMP"
    fi
fi
if [ -d "venv" ]; then
    ./venv/bin/python3 generate-images.py
else
    python3 generate-images.py
fi
"""

[tasks."img:logo"]
description = "Generate logo PNG files from SVG"
run = "cargo run --manifest-path tools/Cargo.toml --release -- build img"

[tasks."img:clean"]
description = "Clean generated images"
dir = "img"
# Skips anything git tracks. img/logo.png is generated and committed, so deleting it leaves
# the working tree with a missing tracked file, and a later blanket `git add -A` stages that
# deletion without anybody noticing. It has happened once. A clean task exists to remove
# build output, and a committed artifact is not build output in that sense.
run = """
for f in *.png *.jpg *.ico; do
  [ -e "$f" ] || continue
  git ls-files --error-unmatch "$f" >/dev/null 2>&1 && continue
  rm -f "$f"
done
rm -rf venv
"""

