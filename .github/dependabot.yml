# Keep dependencies, base images, and Actions current automatically.
# Grouped weekly PRs per ecosystem, but MINOR/PATCH only — major bumps come as
# individual PRs so one breaking major can't block a group of safe updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: nuget
    directory: /cs
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gradle
    directory: /kt
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # junit-jupiter 6.x requires JDK 17; the project pins jvmToolchain(11).
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directories:
      - /rs/pragmastat
      - /rs/pragmastat-sim
      - /tools
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - /ts
      - /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # katex is pinned to the range rehype-katex accepts. rehype-katex 7.0.1
      # (latest) requires katex ^0.16, so 0.17+ cannot render the manual; a bump
      # would only add an unused copy. For a 0.x package semver-minor is the
      # breaking step, hence both types. Revisit when rehype-katex widens its range.
      - dependency-name: "katex"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: pip
    directories:
      - /py
      - /img
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /cs
      - /go
      - /img
      - /kt
      - /py
      - /r
      - /rs
      - /ts
      - /web
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Base images are pinned to the mise toolchain (with sync comments to the
      # setup-* actions). Move runtime floors holistically, not via docker-only bumps.
      - dependency-name: "python"
      - dependency-name: "node"
      - dependency-name: "eclipse-temurin"
      - dependency-name: "rocker/verse"
