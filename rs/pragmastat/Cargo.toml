[package]
name = "pragmastat"
version = "14.0.1"
edition = "2024"
rust-version = "1.87"
authors = ["Andrey Akinshin"]
description = "Pragmastat: Pragmatic Statistical Toolkit"
license = "MIT"
repository = "https://github.com/AndreyAkinshin/pragmastat"
documentation = "https://pragmastat.dev"
homepage = "https://pragmastat.dev"
keywords = ["statistics"]
categories = ["mathematics"]

[package.metadata]
doi = "10.5281/zenodo.17236778"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: without it serde_json uses a fast float parser that is
# accurate to within an ulp but not correctly rounded, so a fixture written as
# -0.23552140697665314 can parse one ulp low. The randomization suites compare
# bitwise, which makes that the difference between a pass and a false failure.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
float-cmp = "0.10"

[lib]
name = "pragmastat"
path = "src/lib.rs"
